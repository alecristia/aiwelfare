# Prior-work catalogue: quantified effects of AI on human health, mortality or welfare.
#
# Produced by the prior-work search described in docs/prior-work-search.md (search date 2026-11-25).
# Every entry below was opened and read before inclusion. Where only part of an item could be read
# (abstract, summary page, press release), `accessed` says so and the fields reflect only that part.
# Items that looked relevant but could not be read are listed in docs/related-work.md ("Not accessed"),
# not here.
#
# Field notes:
#   tier: A multi-risk quantification | B single-pathway quantification |
#         C probability forecasts usable as inputs | D methods and frameworks
#   closeness_to_this_repo: 0-3 (3 = near-term, AI-specific, health-denominated, directly usable)
#   usable_as: precedent | claim source for card X | baseline | method | none
#   Card ids used in usable_as: bio-misuse and clinical-errors are the only cards named so far in
#   docs/examples/risk-card-bio-misuse.md. Other pathways are proposed in candidate_new_card and
#   checked against D2 in docs/related-work.md.
#   short_quote: verbatim, under 25 words, at most one per item.
#
# This file records what each source SAYS. It makes no judgement about how sources should be combined.

items:

