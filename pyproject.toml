[project]
name = "aiwelfare"
version = "0.1.0"
description = "Risk-by-risk estimates of AI's health impact (DALYs, 2026–2031), traceable to sources"
readme = "VISION.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
aiwelfare = "aiwelfare.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwelfare"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Card and terminal rendering: long f-string templates read better unbroken.
"src/aiwelfare/card.py" = ["E501"]
"src/aiwelfare/cli.py" = ["E501"]
"src/aiwelfare/site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
