notes: >
  v1 (Dec 2024) was titled "The Unpaid Toll: Quantifying the Public Health Impact of AI"
  and is the version covered by the UC Riverside news release ("as many as 1,300 premature
  deaths a year by 2030"). v4 reports 2023 and 2028 only. Uses EPA COBRA Desktop v5.1 with
  baseline emissions from EPA's 2016v1 platform (regulations as of May 2018). Covers all
  US data centres (contiguous US), scope 1 (backup generators, at 10% of permitted
  emissions) and scope 2 (grid electricity, average attribution). Not AI-specific.
