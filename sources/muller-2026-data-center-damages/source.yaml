notes: >
  AP4 integrated assessment model with S&P Global facility-level data for ~2,800 operational
  data centres (Q3 2025). Reports damages in dollars (air pollution + greenhouse gases), not
  deaths; deaths can only be derived via the VSL. Includes cryptocurrency-mining facilities.
  The AI share it uses (15%) is taken from IEA (2025), not estimated.
