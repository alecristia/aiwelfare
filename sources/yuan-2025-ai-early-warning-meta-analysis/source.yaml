notes: >
  Meta-analysis of five prospective, non-randomised evaluations of ML early-warning systems in
  non-ICU adult inpatients (searched to April 2024), random-effects odds ratios. Includes the
  Kaiser Permanente 19-hospital study (Escobar et al.) and CHARTwatch (Verma et al.), so it
  overlaps with verma-2024-chartwatch. Evidence covers 2013/2024. Kept url-only, like the other
  sources, so nothing is mirrored without checking.
