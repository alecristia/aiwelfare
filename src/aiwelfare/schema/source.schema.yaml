$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/alecristia/aiwelfare/schema/source.schema.yaml
title: Source
description: >
  Metadata for one source (sources/<id>/source.yaml). See docs/sources.md and
  VISION.md, Sources.
type: object
additionalProperties: false
required: [id, mock, title, authors, type, evidence_date, published, version,
           url, redistribution, evidence_basis, author_interests]
properties:
  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: <first-author>-<year>-<short-slug>. Never changes.
  mock:
    type: boolean
    description: true only for invented sources under mock/ (D13).
  title: {type: string}
  authors:
    type: array
    minItems: 1
    items: {type: string}
  publisher:
    type: string
    description: Journal, preprint server, institution or website.
  type:
    enum: [peer-reviewed, preprint, intergovernmental-report, government-report,
           technical-evaluation, lab-disclosure, forecast-aggregate, expert-survey,
           incident-report, commentary, dataset]
  evidence_date:
    type: string
    pattern: "^\\d{4}(-\\d{2}(-\\d{2})?)?$"
    description: When the evidence describes (e.g. the data year), not publication.
  published:
    type: string
    pattern: "^\\d{4}(-\\d{2}(-\\d{2})?)?$"
    description: Publication date of the version read.
  version:
    type: string
    description: Exact version read (e.g. "arXiv v4"), or "accessed YYYY-MM-DD".
  accessed:
    type: string
    format: date
  url:
    type: string
    format: uri
    description: URL of the file that was read and is tracked by DataLad.
  landing_page: {type: string, format: uri}
  doi: {type: string}
  license: {type: string}
  redistribution:
    enum: [open, url-only]
    description: open = may be mirrored; url-only = URL and checksum only (D1).
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
    description: Checksum of the file read. DataLad also records its own key.
  evidence_basis:
    type: array
    minItems: 1
    items: {enum: [measured, modelled, expert-judgement, speculation]}
  author_interests:
    type: array
    description: Factual statements about interests; empty if none identified.
    items:
      type: object
      additionalProperties: false
      required: [kind, note]
      properties:
        kind:
          enum: [developer-self-report, funder, industry-affiliation,
                 advocacy, government, none-identified]
        note: {type: string}
  peer_review:
    type: string
    description: Free-text status, e.g. "accepted at CACM (per arXiv comments)".
  supersedes: {type: string}
  superseded_by: {type: string}
  notes: {type: string}
